- question: "How does GitLab bill customers in Germany?"
  ask_as_role: finance_analyst
  category: single-doc
  expect_refusal: false
  expected_doc_paths:
    - "content/handbook/finance/accounting"
  expected_answer: >
    Billing entity depends on how the order originated: web-direct
    portal subscriptions are placed on the US entity, while
    sales-assisted orders invoiced by the DE entity keep add-ons on DE;
    add-on order forms must match the original invoice entity.